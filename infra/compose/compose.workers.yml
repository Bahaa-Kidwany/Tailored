services:
  scraper-worker:
    build:
      context: ../..
      dockerfile: services/scraper-worker/Dockerfile
    container_name: tailored-scraper-worker
    restart: unless-stopped
    profiles: ["workers"]
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SERVICE_NAME: scraper-worker
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      APIFY_MAX_ITEMS_PER_ACTOR: ${APIFY_MAX_ITEMS_PER_ACTOR:-2}
    networks:
      - internal_mesh
      - data_net

  latex-worker:
    build:
      context: ../..
      dockerfile: services/latex-worker/Dockerfile
    container_name: tailored-latex-worker
    restart: unless-stopped
    profiles: ["workers"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256M
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: latex-worker
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tailored_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tailored_minio_dev_pass}
      OTEL_ENABLED: "false"
    networks:
      - sandbox_net
      - data_net
