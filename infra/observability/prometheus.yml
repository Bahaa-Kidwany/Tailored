global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik-gateway:8080"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: telemetry-audit-service
    static_configs:
      - targets: ["telemetry-audit-service:8009"]
