<script>
    function toggleSkill(button) {
      const isActive = button.getAttribute('data-active') === 'true';
      const label = button.querySelector('span:first-of-type')?.innerText || button.innerText.replace(/[+×]/g, '').trim();

      if (isActive) {
        button.setAttribute('data-active', 'false');
        button.className = "group inline-flex items-center gap-1 bg-[#f4f7f4] text-stone-700 hover:bg-stone-200/80 rounded-full px-3 py-1.5 text-xs font-medium transition-colors";
        button.innerHTML = `
          <span class="material-symbols-outlined text-[14px] text-stone-400 group-hover:text-stone-700">add</span>
          <span>${label}</span>
        `;
      } else {
        button.setAttribute('data-active', 'true');
        button.className = "group inline-flex items-center gap-1.5 bg-[#1B382B] text-white hover:bg-[#142a20] rounded-full px-3.5 py-1.5 text-xs font-medium transition-colors";
        button.innerHTML = `
          <span>${label}</span>
          <span class="material-symbols-outlined text-[14px] text-white/70 group-hover:text-white">close</span>
        `;
      }
    }

    function addCustomSkill() {
      const input = document.getElementById('custom-skill-input');
      const val = input.value.trim();
      if (!val) return;

      const container = document.getElementById('competencies-container');
      const newBtn = document.createElement('button');
      newBtn.type = 'button';
      newBtn.onclick = function() { toggleSkill(this); };
      newBtn.setAttribute('data-active', 'true');
      newBtn.className = "group inline-flex items-center gap-1.5 bg-[#1B382B] text-white hover:bg-[#142a20] rounded-full px-3.5 py-1.5 text-xs font-medium transition-colors";
      newBtn.innerHTML = `
        <span>${val}</span>
        <span class="material-symbols-outlined text-[14px] text-white/70 group-hover:text-white">close</span>
      `;
      container.appendChild(newBtn);
      input.value = '';
    }
  </script>

<script>
  function makePrimary(btn) {
    const parentContainer = document.getElementById('contact-list');
    parentContainer.querySelectorAll('.primary-btn, [data-primary="true"]').forEach(el => {
      el.removeAttribute('data-primary');
      el.outerHTML = `<button type="button" onclick="makePrimary(this)" class="inline-flex items-center px-3 py-1 rounded-full bg-white border border-stone-200 text-stone-600 hover:text-stone-900 hover:border-stone-400 text-xs font-medium transition-colors">Make Primary</button>`;
    });
    btn.outerHTML = `<span data-primary="true" class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-[#1B382B] text-white text-xs font-medium shadow-xs"><span class="material-symbols-outlined text-[14px]">check</span> Primary</span>`;
  }

  function toggleMode(btn) {
    const active = btn.classList.contains('bg-[#1B382B]');
    if (active) {
      btn.classList.remove('bg-[#1B382B]', 'text-white');
      btn.classList.add('bg-white', 'text-stone-600', 'border', 'border-stone-200');
    } else {
      btn.classList.add('bg-[#1B382B]', 'text-white');
      btn.classList.remove('bg-white', 'text-stone-600', 'border', 'border-stone-200');
    }
  }
</script>
